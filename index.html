<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Beranda</title>
  <link rel="icon" type="image/x-icon" href="assets/favicon.ico">
  <link rel="icon" type="image/png" sizes="32x32" href="assets/favicon-32.png">
  <link rel="icon" type="image/png" sizes="192x192" href="assets/favicon-192.png">
  <link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <div class="overlay" id="overlay"></div>

  <aside class="drawer" id="drawer">
    <div class="drawer-header">
      <h2>Pengaturan lebih lanjut</h2>
      <button class="icon-btn" id="closeDrawer" aria-label="Tutup">
        <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M5 5l14 14M19 5L5 19"/></svg>
      </button>
    </div>

    <nav class="drawer-nav">
      <button class="drawer-item" id="accountItem">
        <img class="avatar avatar-sm" src="assets/default-avatar.png" alt="Avatar">
        Pengaturan Akun
      </button>

      <button class="drawer-item" id="commentsItem">
        <span class="icon-box">
          <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
        </span>
        Komentar yang Anda Bagikan
      </button>
    </nav>

    <div class="drawer-section" id="adminSection" hidden>
      <span class="drawer-label">Admin</span>

      <button class="drawer-item" id="manageContentItem">
        <span class="icon-box">
          <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20h4L18.5 9.5a2.121 2.121 0 0 0-3-3L5 17v3z"/></svg>
        </span>
        Kelola Konten
      </button>

      <div class="toggle-row">
        <span>Kelola Akses Login</span>
        <button class="toggle is-on" role="switch" aria-checked="true"></button>
      </div>

      <div class="toggle-row">
        <span>Kelola Pengguna</span>
        <button class="toggle is-on" role="switch" aria-checked="true"></button>
      </div>
    </div>
  </aside>

  <div class="modal preview-modal" id="previewModal" hidden>
    <div class="modal-header">
      <h2 id="previewTitle">Karya</h2>
      <div class="preview-actions">
        <a id="previewOpenNewTab" href="#" target="_blank" rel="noopener" class="icon-btn" aria-label="Buka di tab baru">
          <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6M15 3h6v6M10 14 21 3"/></svg>
        </a>
        <button class="icon-btn" id="closePreviewModal" aria-label="Tutup">
          <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M5 5l14 14M19 5L5 19"/></svg>
        </button>
      </div>
    </div>

    <iframe id="previewIframe" class="preview-iframe" title="Preview karya"></iframe>
  </div>

  <div class="modal" id="accountModal" hidden>
    <div class="modal-header">
      <h2>Pengaturan Akun</h2>
      <button class="icon-btn" id="closeAccountModal" aria-label="Tutup">
        <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M5 5l14 14M19 5L5 19"/></svg>
      </button>
    </div>

    <div class="modal-body">
      <img class="avatar avatar-lg" id="accountAvatarPreview" src="assets/default-avatar.png" alt="Avatar">
      <p class="account-email" id="accountEmail"></p>

      <label class="field-label" for="avatarUrlInput">URL Foto Profil</label>
      <input type="url" id="avatarUrlInput" placeholder="https://...">

      <div class="modal-actions">
        <button class="btn-secondary" id="resetAvatarButton">Pakai Default</button>
        <button class="btn-login" id="saveAvatarButton">Simpan</button>
      </div>

      <p class="field-hint" id="accountMessage"></p>

      <button class="btn-logout" id="logoutButton">Keluar</button>
    </div>
  </div>

  <header class="topbar">
    <button class="icon-btn" id="openDrawer" aria-label="Menu">
      <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M3 6h18M3 12h18M3 18h18"/></svg>
    </button>

    <button class="btn-login" id="loginButton" hidden>Masuk</button>

    <div class="user-chip" id="userChip" hidden>
      <span id="userChipEmail">Pengguna</span>
      <img class="avatar" src="assets/default-avatar.png" alt="Avatar">
    </div>
  </header>

  <main class="main-content">
    <div class="empty-state" id="emptyState">
      <h1>Ada yang bisa kami bantu?</h1>
      <p>Belum ada apapun disini</p>
    </div>

    <div class="banner-works" id="bannerWorks"></div>
    <div class="works-grid" id="worksGrid" hidden></div>
  </main>

  <div class="floating-widget" id="floatingWidget">
    <button class="widget-toggle" id="widgetToggle" aria-label="Buka komentar">
      <svg id="iconChat" viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
      <svg id="iconClose" class="is-hidden" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M5 5l14 14M19 5L5 19"/></svg>
    </button>

    <div class="widget-panel" id="widgetPanel" hidden>
      <div class="panel-header">
        <h2>Komentar Global</h2>
      </div>

      <div class="comment-list" id="commentList"></div>

      <div class="comment-footer" id="commentFooter">
        <input type="text" id="commentInput" placeholder="Tulis komentar..." maxlength="500">
        <button class="icon-btn" id="sendCommentButton" aria-label="Kirim">
          <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 2 11 13M22 2l-7 20-4-9-9-4 20-7z"/></svg>
        </button>
      </div>

      <button class="btn-login" id="commentLoginPrompt" hidden>Masuk untuk berkomentar</button>
    </div>
  </div>

  <script type="module" src="js/app.js"></script>
</body>
</html>
