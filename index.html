<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Beranda</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <div class="overlay" id="overlay"></div>

  <aside class="drawer" id="drawer">
    <div class="drawer-header">
      <h2>Pengaturan lebih lanjut</h2>
      <button class="icon-btn" id="closeDrawer" aria-label="Tutup">
        <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M5 5l14 14M19 5L5 19"/></svg>
      </button>
    </div>

    <nav class="drawer-nav">
      <button class="drawer-item" id="accountItem">
        <img class="avatar avatar-sm" src="assets/default-avatar.png" alt="Avatar">
        Pengaturan Akun
      </button>

      <button class="drawer-item" id="commentsItem">
        <span class="icon-box">
          <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
        </span>
        Komentar yang Anda Bagikan
      </button>
    </nav>

    <div class="drawer-section" id="adminSection" hidden>
      <span class="drawer-label">Admin</span>

      <div class="toggle-row">
        <span>Kelola Konten</span>
        <button class="toggle is-on" role="switch" aria-checked="true"></button>
      </div>

      <div class="toggle-row">
        <span>Kelola Akses Login</span>
        <button class="toggle is-on" role="switch" aria-checked="true"></button>
      </div>

      <div class="toggle-row">
        <span>Kelola Pengguna</span>
        <button class="toggle is-on" role="switch" aria-checked="true"></button>
      </div>
    </div>
  </aside>

  <header class="topbar">
    <button class="icon-btn" id="openDrawer" aria-label="Menu">
      <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M3 6h18M3 12h18M3 18h18"/></svg>
    </button>

    <button class="btn-login" id="loginButton" hidden>Masuk</button>

    <div class="user-chip" id="userChip" hidden>
      <span>Pengguna</span>
      <img class="avatar" src="assets/default-avatar.png" alt="Avatar">
    </div>
  </header>

  <main class="empty-state">
    <h1>Ada yang bisa kami bantu?</h1>
    <p>Belum ada apapun disini</p>
  </main>

  <script type="module" src="js/app.js"></script>
</body>
</html>
